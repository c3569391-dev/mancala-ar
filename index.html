<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Mancala — Learning Assistant</title>

  <!-- Fonts: Orbitron/Audiowide (display) + Exo 2/Rajdhani (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Audiowide&family=Exo+2:wght@400;600;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet" />

  <!-- A-Frame loads now; app.js loads the pinned AR.js NFT build only
       after a landscape ENTER press so the webcam cannot start early. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <link rel="stylesheet" href="css/theme.css?v=20260603" />
  <link rel="stylesheet" href="css/ui.css?v=20260603" />
  <link rel="stylesheet" href="css/splash.css?v=20260603" />
</head>
<body>

  <!-- ================= Splash / welcome screen ================= -->
  <!-- Shown first; tapping ENTER starts the camera + AR (user-gesture trigger). -->
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-emblem">AR</div>
      <h1 class="splash-title">AR Mancala<br />Learning Assistant</h1>
      <p class="splash-tagline">Learn Congkak with Augmented Reality</p>
      <button id="start-btn">ENTER</button>
      <p class="splash-note">Tap ENTER, then point your camera at the Congkak marker</p>
    </div>
  </div>

  <!-- ================= Layer A: AR.js NFT board tracking =====================
       The template is inert until app.js creates the scene after a landscape
       ENTER press. AR.js tracks the Congkak image descriptors, and the existing
       Mancala board anchor follows that image target. -->
  <div id="ar-scene-host">
    <template id="ar-scene-template"
              data-arjs-src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js">
      <a-scene embedded
               arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false"
               color-space="sRGB"
               vr-mode-ui="enabled: false"
               device-orientation-permission-ui="enabled: false"
               renderer="alpha: true; colorManagement: true; antialias: true; precision: medium">

        <a-entity light="type: ambient; color: #bcd8ff; intensity: 0.95"></a-entity>
        <a-entity light="type: point; intensity: 0.6; distance: 8" position="0 1 1.5"></a-entity>

        <a-nft id="target"
               type="nft"
               url="assets/nft/congkak-marker"
               emitevents="true"
               smooth="true"
               smoothCount="10"
               smoothTolerance="0.01"
               smoothThreshold="5">
          <!-- Global scale only; individual board geometry remains uncalibrated. -->
          <a-entity id="board-anchor" position="0 0.008 0" rotation="-90 0 0" scale="0.33 0.33 0.33"></a-entity>
        </a-nft>

        <a-entity camera></a-entity>
      </a-scene>
    </template>
  </div>

  <!-- ================= Layer B: screen-fixed UI ================= -->
  <div id="ui">
    <header id="topbar">
      <div id="title-wrap">
        <h1>AR MANCALA</h1>
        <span id="subtitle">Learning Assistant</span>
      </div>
      <button id="home-btn">HOME</button>
    </header>

    <!-- Shown while scanning / when the AR target is lost. -->
    <div id="camera-hint">Point your camera at the Congkak marker</div>

    <div id="bottom">
      <div id="panel" class="panel"></div>
      <div id="options" class="options hidden"></div>
      <nav id="mainnav">
        <button data-module="rules">Rules</button>
        <button data-module="demo">Demo</button>
        <button data-module="quiz">Quiz</button>
        <button data-module="freeplay">Free Play</button>
      </nav>
    </div>
  </div>

  <!-- App scripts (plain JS, no build step) -->
  <script src="js/engine.js?v=20260603"></script>
  <script src="js/presets.js?v=20260603"></script>
  <script src="js/board3d.js?v=20260610c"></script>
  <script src="js/animate.js?v=20260610b"></script>
  <script src="js/modules.js?v=20260609b"></script>
  <script src="js/ar.js?v=20260814nft"></script>
  <script src="js/app.js?v=20260814"></script>
</body>
</html>
